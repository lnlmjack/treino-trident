<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Treinamento TRIDENT (Ultra Rápido)</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #202024;
            --text-color: #e1e1e6;
            --primary: #4a90e2; 
            --primary-hover: #357abd;
            --success: #04d361;
            --danger: #e25858;
            --warning: #eba417;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; }
        
        .card { background-color: var(--panel-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .stats { display: flex; justify-content: space-between; margin-top: 15px; text-align: center; }
        .stat-box { flex: 1; padding: 10px; }
        .stat-value { font-size: 24px; font-weight: bold; }
        .stat-label { font-size: 12px; color: #a8a8b3; text-transform: uppercase; }
        
        input[type="text"], input[type="password"] { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #323238; background: #121214; color: white; font-size: 16px; margin-bottom: 15px; }
        input[type="text"]:focus { outline: 1px solid var(--primary); }
        button { width: 100%; padding: 15px; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px; color: white; }
        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #323238; }
        .btn-secondary:hover { background-color: #404048; }
        .btn-success { background-color: var(--success); }
        .btn-warning { background-color: var(--warning); }
        .btn-danger { background-color: var(--danger); }
        
        .word-list { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .word-item { background: #323238; padding: 15px; border-radius: 8px; font-size: 18px; text-align: center; font-weight: 500; letter-spacing: 1px; }
        #loading { display: none; text-align: center; color: var(--primary); font-weight: bold; margin: 20px 0; }
        
        h2 { font-size: 20px; margin-bottom: 15px; text-align: center; }
        .hidden { display: none !important; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 8px; text-align: center; }
        .feedback-breakdown { font-size: 14px; color: #a8a8b3; margin-top: 10px; text-align: left; line-height: 1.6; }
        .reset-btn { background: none; color: #a8a8b3; border: 1px solid #323238; font-size: 12px; padding: 8px; margin-top: 10px; cursor: pointer; }
        .reset-danger { color: var(--danger); border-color: var(--danger); }
        .reset-danger:hover { background-color: rgba(226, 88, 88, 0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="config-panel">
        <h2>Conexão Segura (OpenRouter)</h2>
        <input type="password" id="api-key" placeholder="Cole a chave (sk-or-...)">
        <button class="btn-primary" onclick="saveApiKey()">Salvar e Começar</button>
    </div>

    <div class="card hidden" id="score-panel">
        <div class="stats">
            <div class="stat-box" style="color: var(--success);">
                <div class="stat-value" id="score-hits">0</div>
                <div class="stat-label">Acertos</div>
            </div>
            <div class="stat-box" style="color: var(--danger);">
                <div class="stat-value" id="score-misses">0</div>
                <div class="stat-label">Erros</div>
            </div>
            <div class="stat-box" style="color: var(--warning);">
                <div class="stat-value" id="score-reveals">0</div>
                <div class="stat-label">Não Sei</div>
            </div>
        </div>
        <button class="btn-secondary" onclick="showHistory()" style="margin-top: 15px;">📜 Ver Histórico</button>
        <button class="reset-btn reset-danger" onclick="resetScores()" style="width: 100%;">Zerar Placar</button>
        <button class="reset-btn" onclick="resetApiKey()" style="width: 100%;">Trocar Chave API</button>
    </div>

    <div class="card hidden" id="game-panel">
        <button class="btn-primary" id="btn-generate" onclick="generateChallenge()">Gerar Novo Desafio</button>
        <div id="loading">Mentalizando rapidamente...</div>
        
        <div id="challenge-area" class="hidden">
            <h2 style="margin-top: 10px; color: #a8a8b3; font-size: 16px;">As 3 palavras do espectador:</h2>
            <div class="word-list" id="word-list"></div>
            
            <input type="text" id="guess-input" placeholder="Qual é a Palavra-Mestre? (Aperte Enter)">
            <button class="btn-success" onclick="checkGuess()">Confirmar Palpite</button>
            <button class="btn-warning" onclick="revealAnswer()">Não sei (Revelar)</button>
        </div>
        
        <div id="feedback-area" class="feedback hidden"></div>
    </div>

    <div class="card hidden" id="history-panel">
        <h2>Histórico Recente</h2>
        <div id="history-list" style="margin-top: 15px; max-height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px;"></div>
        <button class="btn-primary" onclick="closeHistory()" style="margin-top: 20px;">Voltar ao Jogo</button>
        <button class="reset-btn reset-danger" onclick="clearHistory()" style="width: 100%;">Limpar Histórico</button>
    </div>
</div>

<script>
    let currentChallenge = null;
    let scores = { hits: 0, misses: 0, reveals: 0 };
    let matchHistory = [];

    window.onload = () => {
        const savedKey = localStorage.getItem('openrouter_api_key');
        if (savedKey) {
            document.getElementById('api-key').value = savedKey;
            showGame();
        }
        loadScores();
        loadHistory();
    };

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            const gamePanel = document.getElementById('game-panel');
            const challengeArea = document.getElementById('challenge-area');
            const btnGenerate = document.getElementById('btn-generate');

            if (!gamePanel.classList.contains('hidden')) {
                if (!challengeArea.classList.contains('hidden')) {
                    e.preventDefault();
                    checkGuess();
                } 
                else if (!btnGenerate.classList.contains('hidden')) {
                    e.preventDefault();
                    generateChallenge();
                }
            }
        }
    });

    function saveApiKey() {
        const key = document.getElementById('api-key').value.trim();
        if (key) {
            localStorage.setItem('openrouter_api_key', key);
            showGame();
        } else {
            alert('Por favor, insira uma chave válida.');
        }
    }

    function resetApiKey() {
        localStorage.removeItem('openrouter_api_key');
        location.reload();
    }

    function showGame() {
        document.getElementById('config-panel').classList.add('hidden');
        document.getElementById('history-panel').classList.add('hidden');
        document.getElementById('score-panel').classList.remove('hidden');
        document.getElementById('game-panel').classList.remove('hidden');
    }

    function showHistory() {
        document.getElementById('score-panel').classList.add('hidden');
        document.getElementById('game-panel').classList.add('hidden');
        document.getElementById('history-panel').classList.remove('hidden');
        renderHistory();
    }

    function closeHistory() {
        showGame();
    }

    function resetScores() {
        if(confirm("Tem certeza que deseja zerar os contadores de acertos e erros?")) {
            scores = { hits: 0, misses: 0, reveals: 0 };
            updateScoreBoard();
        }
    }

    function loadScores() {
        try {
            const savedScores = JSON.parse(localStorage.getItem('trident_scores'));
            if (savedScores && typeof savedScores.hits === 'number') {
                scores = savedScores;
            } else {
                scores = { hits: 0, misses: 0, reveals: 0 };
            }
        } catch (e) {
            scores = { hits: 0, misses: 0, reveals: 0 };
            localStorage.removeItem('trident_scores');
        }
        updateScoreBoard();
    }

    function updateScoreBoard() {
        document.getElementById('score-hits').innerText = scores.hits;
        document.getElementById('score-misses').innerText = scores.misses;
        document.getElementById('score-reveals').innerText = scores.reveals;
        localStorage.setItem('trident_scores', JSON.stringify(scores));
    }

    function loadHistory() {
        try {
            const savedHistory = JSON.parse(localStorage.getItem('trident_history'));
            if (Array.isArray(savedHistory) && savedHistory.length > 0 && typeof savedHistory[0].palavra !== 'undefined') {
                matchHistory = savedHistory;
            } else {
                matchHistory = [];
                localStorage.removeItem('trident_history');
            }
        } catch (e) {
            matchHistory = [];
            localStorage.removeItem('trident_history'); 
        }
    }

    function saveToHistory(challenge, guess, status) {
        if (!challenge) return;
        
        const now = new Date();
        const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        
        matchHistory.unshift({
            palavra: challenge.palavra_mestre,
            pista1: challenge.pista_1,
            pista2: challenge.pista_2,
            item: challenge.item_categoria,
            palpite: guess || "-",
            status: status,
            data: timeString
        });
        
        if (matchHistory.length > 50) matchHistory.pop(); 
        
        try {
            localStorage.setItem('trident_history', JSON.stringify(matchHistory));
        } catch (e) {
            console.error("Falha ao salvar histórico no navegador", e);
        }
    }

    function clearHistory() {
        if(confirm("Tem certeza que deseja apagar todo o histórico de treinos registrados?")) {
            matchHistory = [];
            localStorage.removeItem('trident_history');
            renderHistory();
        }
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        
        if (!matchHistory || matchHistory.length === 0) {
            list.innerHTML = '<div style="text-align: center; color: #a8a8b3; padding: 20px;">Nenhum treino registrado ainda.</div>';
            return;
        }
        
        try {
            list.innerHTML = matchHistory.map(h => {
                let cor = h.status === 'hit' ? 'var(--success)' : (h.status === 'miss' ? 'var(--danger)' : 'var(--warning)');
                let icone = h.status === 'hit' ? '🎯' : (h.status === 'miss' ? '❌' : '👁️');
                
                let alvo = (h.palavra || 'ERRO').toUpperCase();
                let palpite = (h.palpite || '-').toUpperCase();
                let pistaItem = (h.item || '-').toUpperCase();
                let pista1 = (h.pista1 || '-').toUpperCase();
                let pista2 = (h.pista2 || '-').toUpperCase();
                let dataStr = h.data || '';

                return `<div style="background: #323238; padding: 12px; border-radius: 8px; border-left: 5px solid ${cor}; font-size: 14px; text-align: left;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                        <strong style="color: white;">${icone} Alvo: ${alvo}</strong>
                        <span style="font-size: 11px; color: #a8a8b3;">${dataStr}</span>
                    </div>
                    <div style="color: #e1e1e6; margin-bottom: 5px;">Seu palpite: <strong>${palpite}</strong></div>
                    <div style="font-size: 13px; color: #a8a8b3;"><em>Pistas: ${pistaItem} | ${pista1} | ${pista2}</em></div>
                </div>`;
            }).join('');
        } catch (error) {
            list.innerHTML = '<div style="text-align: center; color: var(--danger); padding: 20px;">Erro de memória antiga. Clique em Limpar Histórico.</div>';
        }
    }

    function normalizeString(str) {
        if (!str) return "";
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    }

    // Função de geração otimizada para velocidade (máximo de 1 retry)
    async function generateChallenge(retryCount = 0) {
        const apiKey = localStorage.getItem('openrouter_api_key');
        const maxRetries = 1; // Reduzido de 3 para 1 para evitar demora excessiva

        document.getElementById('btn-generate').classList.add('hidden');
        document.getElementById('challenge-area').classList.add('hidden');
        document.getElementById('feedback-area').classList.add('hidden');
        document.getElementById('loading').style.display = 'block';
        
        if(retryCount === 0) {
            document.getElementById('loading').innerText = 'Mentalizando rapidamente...';
        } else {
            document.getElementById('loading').innerText = 'Afinando as pistas...';
        }
        
        document.getElementById('guess-input').value = '';

        const categoriasComuns = [
            "Utensílios de Cozinha", "Material Escolar", "Roupas ou Calçados",
            "Móveis de Casa", "Eletrodomésticos", "Ferramentas Comuns",
            "Artigos de Banheiro", "Alimentos e Bebidas", "Acessórios Pessoais",
            "Animais Domésticos", "Meios de Transporte", "Instrumentos Musicais",
            "Profissões", "Brinquedos Clássicos", "Frutas e Legumes", 
            "Material de Construção", "Artigos de Praia", "Material de Escritório", 
            "Objetos de Decoração", "Artigos Esportivos", "Produtos de Limpeza"
        ];
        const temaSorteado = categoriasComuns[Math.floor(Math.random() * categoriasComuns.length)];
        const semente = Math.floor(Math.random() * 9999999);

        // Prompt hyper-estruturado com exemplo visual para impedir que a IA erre as letras
        const prompt = `Atue como um espectador no Brasil participando do truque TRIDENT. Semente: ${semente}.
        Tema OBRIGATÓRIO: ${temaSorteado}. 

        REGRAS INEGOCIÁVEIS:
        1. "palavra_mestre": Um objeto físico de SEGUNDO ESCALÃO da categoria (fuja da primeira coisa que vier à mente).
        2. "categoria": ${temaSorteado}.
        3. "item_categoria": Outro objeto diferente da mesma categoria.
        4. "pista_1": Uma palavra comum no Brasil que OBRIGATORIAMENTE comece com a PRIMEIRA LETRA da palavra_mestre.
        5. "pista_2": Uma palavra muito curta (2 a 4 letras) que OBRIGATORIAMENTE comece com a SEGUNDA LETRA da palavra_mestre.
        
        EXEMPLO ESTRITO (SE A PALAVRA FOR CADEIRA):
        {
          "palavra_mestre": "CADEIRA",
          "categoria": "Móveis de Casa",
          "item_categoria": "MESA",
          "pista_1": "CONFORTÁVEL",
          "pista_2": "ALTA"
        }
        
        RETORNE APENAS O JSON LIMPO E MAIS NADA.`;

        try {
            const response = await fetch(`https://openrouter.ai/api/v1/chat/completions`, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json',
                    'HTTP-Referer': 'https://lnlmjack.github.io/treino-trident/',
                    'X-Title': 'Treino Trident App'
                },
                body: JSON.stringify({
                    model: "openrouter/auto",
                    messages: [
                        { role: "system", content: "Retorne apenas JSON. Siga perfeitamente a regra da primeira e segunda letra." },
                        { role: "user", content: prompt }
                    ],
                    temperature: 0.8 
                })
            });

            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.error.message);
            }

            let jsonText = data.choices[0].message.content;
            jsonText = jsonText.replace(/```json/gi, '').replace(/```/gi, '').trim();
            
            let challengeData = JSON.parse(jsonText);

            const pmNorm = normalizeString(challengeData.palavra_mestre);
            const p1Norm = normalizeString(challengeData.pista_1);
            const p2Norm = normalizeString(challengeData.pista_2);

            if (p1Norm[0] !== pmNorm[0] || p2Norm[0] !== pmNorm[1] || normalizeString(challengeData.item_categoria) === pmNorm) {
                if (retryCount < maxRetries) {
                    return generateChallenge(retryCount + 1);
                } else {
                    alert("A IA demorou muito para encontrar palavras com as letras exatas. Aperte Enter para pular para a próxima rodada.");
                    document.getElementById('btn-generate').classList.remove('hidden');
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
            }

            currentChallenge = challengeData;
            displayChallenge(challengeData);

        } catch (error) {
            console.error(error);
            alert("Erro de comunicação da API. Tente clicar em gerar de novo. Detalhe: " + error.message);
            document.getElementById('btn-generate').classList.remove('hidden');
            document.getElementById('loading').style.display = 'none';
        }
    }

    function displayChallenge(data) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('challenge-area').classList.remove('hidden');
        
        let clues = [data.item_categoria, data.pista_1, data.pista_2];
        
        for (let i = clues.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [clues[i], clues[j]] = [clues[j], clues[i]];
        }
        
        const listHtml = clues.map(clue => `<div class="word-item">${clue.toUpperCase()}</div>`).join('');
        document.getElementById('word-list').innerHTML = listHtml;
        
        document.getElementById('guess-input').focus();
    }

    function checkGuess() {
        const guess = normalizeString(document.getElementById('guess-input').value);
        const answer = normalizeString(currentChallenge.palavra_mestre);
        const feedback = document.getElementById('feedback-area');
        
        if (!guess) return;

        feedback.classList.remove('hidden');
        
        if (guess === answer) {
            scores.hits++;
            saveToHistory(currentChallenge, guess, 'hit');
            feedback.style.backgroundColor = 'rgba(4, 211, 97, 0.2)';
            feedback.innerHTML = `<h3 style="color: var(--success);">🎯 Sensacional! Você acertou.</h3>`;
        } else {
            scores.misses++;
            saveToHistory(currentChallenge, guess, 'miss');
            feedback.style.backgroundColor = 'rgba(226, 88, 88, 0.2)';
            feedback.innerHTML = `<h3 style="color: var(--danger);">❌ Incorreto.</h3>`;
        }
        
        showBreakdown(feedback);
        updateScoreBoard();
        document.getElementById('btn-generate').classList.remove('hidden');
        document.getElementById('challenge-area').classList.add('hidden');
        
        document.getElementById('btn-generate').focus();
    }

    function revealAnswer() {
        scores.reveals++;
        saveToHistory(currentChallenge, null, 'reveal');
        updateScoreBoard();
        
        const feedback = document.getElementById('feedback-area');
        feedback.classList.remove('hidden');
        feedback.style.backgroundColor = 'rgba(235, 164, 23, 0.2)';
        feedback.innerHTML = `<h3 style="color: var(--warning);">👁️ Revelado</h3>`;
        
        showBreakdown(feedback);
        document.getElementById('btn-generate').classList.remove('hidden');
        document.getElementById('challenge-area').classList.add('hidden');
        
        document.getElementById('btn-generate').focus();
    }

    function showBreakdown(element) {
        const c = currentChallenge;
        element.innerHTML += `
            <div class="feedback-breakdown">
                <strong>Palavra-Mestre:</strong> ${c.palavra_mestre.toUpperCase()} <br><br>
                <strong>Lógica (Script TRIDENT):</strong><br>
                • <em>Categoria (${c.categoria}):</em> ${c.item_categoria}<br>
                • <em>1ª Letra (${c.palavra_mestre[0].toUpperCase()} - Comum):</em> ${c.pista_1}<br>
                • <em>2ª Letra (${c.palavra_mestre[1].toUpperCase()} - Curta):</em> ${c.pista_2}
            </div>
        `;
    }
</script>

</body>
</html>
